name: Deploy Azure Environment

on:
  pull_request:
    paths:
      - ".github/workflows/azure-deploy.yml"
      - "terraform/azure/aks/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/azure-deploy.yml"
      - "terraform/azure/aks/**"
  workflow_dispatch:
    inputs:
      operation:
        description: Plan or create/update the AKS environment
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: terraform-azure-aks
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.15.8
  ARGO_CD_CHART_VERSION: 10.4.0

jobs:
  plan:
    name: Plan AKS infrastructure
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: terraform/azure/aks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check formatting
        run: terraform fmt -check

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform changes
        run: |
          if ! terraform plan -json -input=false -out=tfplan > "$RUNNER_TEMP/terraform-plan.json" 2> "$RUNNER_TEMP/terraform-plan.stderr"; then
            echo "Terraform plan failed:" >&2
            jq -r '
              select(.type == "diagnostic" and .diagnostic.severity == "error")
              | .diagnostic.summary
            ' "$RUNNER_TEMP/terraform-plan.json" >&2
            echo "Detailed output was not published to protect infrastructure metadata." >&2
            exit 1
          fi

          terraform show -json tfplan | jq -r '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"] or .change.importing != null)
              | if .change.importing != null then
                  "import \(.address)"
                else
                  "\(.change.actions | join("/")) \(.address)"
                end]
            | if length == 0 then
                "No infrastructure changes."
              else
                "Terraform plan summary:\n" + join("\n")
              end
          '

  apply:
    name: Create/Update Azure environment
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: azure-apply

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: terraform/azure/aks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check formatting
        run: terraform fmt -check

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Create Terraform plan
        run: |
          if ! terraform plan -input=false -out=tfplan > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            echo "Terraform plan failed. Detailed output was not published to protect infrastructure metadata." >&2
            exit 1
          fi

          terraform show -json tfplan | jq -r '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"] or .change.importing != null)
              | if .change.importing != null then
                  "import \(.address)"
                else
                  "\(.change.actions | join("/")) \(.address)"
                end]
            | if length == 0 then
                "No infrastructure changes."
              else
                "Terraform plan summary:\n" + join("\n")
              end
          '

      - name: Apply Terraform plan
        if: github.event_name == 'push' || inputs.operation != 'plan'
        run: |
          if ! terraform apply -input=false -auto-approve tfplan > "$RUNNER_TEMP/terraform-apply.log" 2>&1; then
            echo "Terraform apply failed. Detailed output was not published to protect infrastructure metadata." >&2
            exit 1
          fi

          echo "Terraform apply completed successfully."

      - name: Set up kubectl
        if: github.event_name == 'push' || inputs.operation != 'plan'
        uses: azure/setup-kubectl@v5

      - name: Configure kubectl
        if: github.event_name == 'push' || inputs.operation != 'plan'
        run: |
          az aks get-credentials \
            --admin \
            --overwrite-existing \
            --resource-group "$(terraform output -raw resource_group_name)" \
            --name "$(terraform output -raw cluster_name)" \
            > /dev/null

      - name: Set up Helm
        if: github.event_name == 'push' || inputs.operation != 'plan'
        uses: azure/setup-helm@v5

      - name: Install Argo CD
        if: github.event_name == 'push' || inputs.operation != 'plan'
        working-directory: .
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm upgrade --install argocd argo/argo-cd \
            --version "$ARGO_CD_CHART_VERSION" \
            --namespace argocd \
            --create-namespace \
            --wait \
            --timeout 10m

      - name: Bootstrap Azure GitOps applications
        if: github.event_name == 'push' || inputs.operation != 'plan'
        working-directory: .
        run: |
          kubectl apply -f argocd/roots/azure.yaml
          kubectl wait \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/azure \
            --namespace argocd \
            --timeout 5m
