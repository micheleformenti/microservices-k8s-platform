name: Destroy Azure Environment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type destroy to confirm the AKS environment teardown
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-azure-aks
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.15.8

jobs:
  destroy:
    name: Destroy Azure environment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-apply

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_key_vault_name: ${{ secrets.AZURE_KEY_VAULT_NAME }}

    defaults:
      run:
        working-directory: terraform/azure/aks

    steps:
      - name: Confirm destruction
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        working-directory: .
        run: |
          if [ "$CONFIRMATION" != "destroy" ]; then
            echo "Destruction not confirmed. Enter exactly: destroy" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check formatting
        run: terraform fmt -check

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Remove GitOps applications
        run: |
          if ! terraform state show azurerm_kubernetes_cluster.platform > /dev/null 2>&1; then
            echo "AKS is not present in Terraform state; skipping GitOps cleanup."
            exit 0
          fi

          RESOURCE_GROUP="$(terraform output -raw resource_group_name)"
          CLUSTER_NAME="$(terraform output -raw cluster_name)"
          NODE_RESOURCE_GROUP="$(
            az aks show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CLUSTER_NAME" \
              --query nodeResourceGroup \
              --output tsv
          )"

          az aks get-credentials \
            --admin \
            --overwrite-existing \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            > /dev/null

          if kubectl get crd applications.argoproj.io > /dev/null 2>&1; then
            if kubectl get application azure -n argocd > /dev/null 2>&1; then
              kubectl delete application azure \
                --namespace argocd \
                --wait=true \
                --timeout 15m
            fi
          else
            echo "Argo CD is not installed; skipping application cleanup."
          fi

          mapfile -t GATEWAY_IDS < <(
            az resource list \
              --resource-group "$NODE_RESOURCE_GROUP" \
              --resource-type Microsoft.ServiceNetworking/trafficControllers \
              --query '[].id' \
              --output tsv
          )

          if [ "${#GATEWAY_IDS[@]}" -gt 0 ]; then
            echo "Waiting for Application Gateway for Containers deletion..."
            az resource wait \
              --deleted \
              --ids "${GATEWAY_IDS[@]}" \
              --interval 20 \
              --timeout 1800
          fi

          if helm status argocd -n argocd > /dev/null 2>&1; then
            helm uninstall argocd -n argocd --wait --timeout 5m
          fi

      - name: Create destroy plan
        run: |
          if ! terraform plan -destroy -input=false -out=tfplan > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            echo "Terraform destroy plan failed. Detailed output was not published to protect infrastructure metadata." >&2
            exit 1
          fi

          terraform show -json tfplan | jq -r '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"])
              | "\(.change.actions | join("/")) \(.address)"]
            | if length == 0 then
                "No infrastructure resources to destroy."
              else
                "Terraform destroy summary:\n" + join("\n")
              end
          '

      - name: Apply destroy plan
        run: |
          if ! terraform apply -input=false -auto-approve tfplan > "$RUNNER_TEMP/terraform-destroy.log" 2>&1; then
            echo "Terraform destroy failed. Detailed output was not published to protect infrastructure metadata." >&2
            exit 1
          fi

          echo "Terraform destroy completed successfully."
