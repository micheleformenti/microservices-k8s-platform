name: Destroy Azure Environment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type destroy to confirm the AKS environment teardown
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-azure-aks
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.15.8

jobs:
  destroy:
    name: Destroy AKS infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-apply

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: terraform/azure/aks

    steps:
      - name: Confirm destruction
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        working-directory: .
        run: |
          if [ "$CONFIRMATION" != "destroy" ]; then
            echo "Destruction not confirmed. Enter exactly: destroy" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check formatting
        run: terraform fmt -check

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Create destroy plan
        run: |
          if ! terraform plan -destroy -input=false -out=tfplan > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            echo "Terraform destroy plan failed. Detailed output was not published to protect infrastructure metadata." >&2
            exit 1
          fi

          terraform show -json tfplan | jq -r '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"])
              | "\(.change.actions | join("/")) \(.address)"]
            | if length == 0 then
                "No infrastructure resources to destroy."
              else
                "Terraform destroy summary:\n" + join("\n")
              end
          '

      - name: Apply destroy plan
        run: |
          if ! terraform apply -input=false -auto-approve tfplan > "$RUNNER_TEMP/terraform-destroy.log" 2>&1; then
            echo "Terraform destroy failed. Detailed output was not published to protect infrastructure metadata." >&2
            exit 1
          fi

          echo "Terraform destroy completed successfully."
