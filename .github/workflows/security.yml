name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.74.0

jobs:
  repository-scan:
    name: Repository scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Scan secrets
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: 1

      - name: Scan Terraform configuration
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: terraform
          severity: CRITICAL
          exit-code: 1

      - name: Scan Dockerfiles
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: src
          severity: CRITICAL
          exit-code: 1

      - name: Set up Helm
        if: always()
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Render application Helm chart
        id: render_application
        if: always()
        run: |
          helm template microservices-platform ./helm/application \
            --namespace microservices-platform \
            -f helm/application/values.yaml \
            -f helm/application/values-local.yaml \
            > rendered-application-local.yaml
          helm template microservices-platform ./helm/application \
            --namespace microservices-platform \
            -f helm/application/values.yaml \
            -f helm/application/values-eks.yaml \
            --set frontend.ingress.host=eks.example.com \
            --set-string 'frontend.ingress.annotations.alb\.ingress\.kubernetes\.io/certificate-arn=arn:aws:acm:eu-central-1:123456789012:certificate/example' \
            > rendered-application-eks.yaml
          helm template microservices-platform ./helm/application \
            --namespace microservices-platform \
            -f helm/application/values.yaml \
            -f helm/application/values-aks.yaml \
            > rendered-application-aks.yaml

      - name: Scan local Kubernetes configuration
        if: always() && steps.render_application.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: rendered-application-local.yaml
          severity: CRITICAL
          exit-code: 1

      - name: Scan EKS Kubernetes configuration
        if: always() && steps.render_application.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: rendered-application-eks.yaml
          severity: CRITICAL
          exit-code: 1

      - name: Scan AKS Kubernetes configuration
        if: always() && steps.render_application.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: rendered-application-aks.yaml
          severity: CRITICAL
          exit-code: 1
