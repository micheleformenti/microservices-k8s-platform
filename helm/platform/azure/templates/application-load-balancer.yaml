{{- if .Values.applicationGateway.enabled }}
apiVersion: alb.networking.azure.io/v1
kind: ApplicationLoadBalancer
metadata:
  name: platform
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  associations:
    - {{ required "applicationGateway.subnetId is required" .Values.applicationGateway.subnetId | quote }}
{{- end }}
