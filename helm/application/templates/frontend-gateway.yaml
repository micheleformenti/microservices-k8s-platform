{{- if .Values.frontend.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: frontend
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ms-k8s-platform.frontendLabels" . | nindent 4 }}
  {{- with .Values.frontend.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.frontend.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      {{- with .Values.frontend.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
