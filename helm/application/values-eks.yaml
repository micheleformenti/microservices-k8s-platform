imagePullSecrets:
  - name: ghcr-pull

externalSecrets:
  enabled: true
  remoteKey: microservices-platform/ghcr

secretStore:
  enabled: true
  name: aws-secrets-manager
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1

adService:
  image:
    repository: ghcr.io/micheleformenti/adservice
    tag: f5222b4bacd5275843c7ef652f8fe2f7944c95c9
    pullPolicy: IfNotPresent

cartService:
  image:
    repository: ghcr.io/micheleformenti/cartservice
    tag: 61d8b4635afb1a8bd10e1306bbe6d30b2fa62761
    pullPolicy: IfNotPresent

checkoutService:
  image:
    repository: ghcr.io/micheleformenti/checkoutservice
    tag: c347e5e9a811faedd6ea956ecef81cc4dcd44ca1
    pullPolicy: IfNotPresent

currencyService:
  image:
    repository: ghcr.io/micheleformenti/currencyservice
