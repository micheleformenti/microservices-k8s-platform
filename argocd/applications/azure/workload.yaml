apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: azure-workload
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - clusters:
        selector:
          matchLabels:
            cloud: azure

  template:
    metadata:
      name: azure-workload
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default

      source:
        repoURL: https://github.com/micheleformenti/microservices-k8s-platform.git
        targetRevision: main
        path: helm/application
        helm:
          releaseName: microservices-platform
          valueFiles:
            - values.yaml
            - values-aks.yaml
          parameters:
            - name: secretStore.provider.azurekv.vaultUrl
              value: '{{ index .metadata.annotations "gitops-bridge/key-vault-uri" }}'

      destination:
        server: '{{ .server }}'
        namespace: microservices-platform

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
